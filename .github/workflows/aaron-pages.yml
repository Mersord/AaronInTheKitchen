name: Aaron CMS - 2. Publish website

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aaron-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check that the one-time import has completed
        id: check
        run: |
          if [ -f cms/settings.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Run Aaron CMS - 1. Import current recipes first. The current website has not been changed."
          fi
      - uses: actions/setup-python@v7
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cms/requirements.txt
      - name: Build and validate the public website
        if: steps.check.outputs.ready == 'true'
        run: |
          python -m pip install -r cms/requirements.txt
          python -m unittest discover -s cms -p 'test_*.py' -v
          python cms/site.py build
      - uses: actions/upload-pages-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
